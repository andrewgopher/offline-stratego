name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test rules and match protocol
        run: ./scripts/test.sh -c release

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OfflineBarrage-app
          path: dist/OfflineBarrage.zip
          retention-days: 30

      - name: App launch smoke test
        run: |
          ./dist/OfflineBarrage.app/Contents/MacOS/OfflineBarrage > launch.log 2>&1 &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            echo "App launched and is still running."
            kill "$pid"
          else
            echo "App exited during launch:"
            cat launch.log
            exit 1
          fi

      - name: Peer-to-peer smoke test (two processes on this Mac)
        # Informational: CI runners may not allow local-network discovery.
        continue-on-error: true
        run: |
          swift build -c release --product PeerSmokeTest
          bin="$(swift build -c release --show-bin-path)/PeerSmokeTest"
          "$bin" guest > guest.log 2>&1 &
          guest=$!
          set +e
          "$bin" host > host.log 2>&1
          host_status=$?
          wait "$guest"
          guest_status=$?
          cat host.log
          echo "---"
          cat guest.log
          [ "$host_status" -eq 0 ] && [ "$guest_status" -eq 0 ]

      - name: 2v2 smoke test (four processes on this Mac)
        # Informational, like the 1v1 smoke test above.
        continue-on-error: true
        run: |
          bin="$(swift build -c release --show-bin-path)/PeerSmokeTest"
          pids=()
          for role in team-b team-c team-d; do
            "$bin" "$role" > "$role.log" 2>&1 &
            pids+=($!)
          done
          set +e
          sleep 1
          "$bin" team-a > team-a.log 2>&1
          status=$?
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          for role in team-a team-b team-c team-d; do
            echo "--- $role"
            cat "$role.log"
          done
          [ "$status" -eq 0 ]

  ios:
    # The iPhone/iPad app, built with Xcode for the simulator and for devices (unsigned).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Build for the iOS simulator
        run: |
          xcodebuild -project iOS/OfflineBarrage.xcodeproj -scheme OfflineBarrage \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build for iPhone and iPad (unsigned)
        run: |
          xcodebuild -project iOS/OfflineBarrage.xcodeproj -scheme OfflineBarrage \
            -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: iOS code check without Xcode's iOS SDK (Mac Catalyst)
        run: ./scripts/check-ios.sh
